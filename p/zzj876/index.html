<p>姬宝的故事很漫长，离世的很大一部分原因是因为父母的单方面家暴。</p>
<p>她很害怕她的父亲。</p>
<p>因她的账号被推特翻了变天账，受到了无辜的冻结，即便是她最亲的朋友也难以回顾那段过往。</p>
